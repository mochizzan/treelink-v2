<!doctype html>
<html lang="id" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Moch Izzan — streamer gabut dan software engineer. Temukan Discord, TikTok, dan halaman Tipmi."
    />
    <meta name="theme-color" content="#DFDBE5" />
    <script>
      // Apply a saved theme before first paint so the CSS-only theme never flashes.
      try {
        var saved = localStorage.getItem('lt2-theme')
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.classList.remove('light', 'dark')
          document.documentElement.classList.add(saved)
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', saved === 'dark' ? '#171220' : '#DFDBE5')
        }
      } catch {}
    </script>
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Moch Izzan — Streamer Gabut & Software Engineer" />
    <meta
      property="og:description"
      content="Ngoding di siang hari, live pas malam. Discord, TikTok, dan Tipmi."
    />
    <title>Moch Izzan — Streamer Gabut & Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
